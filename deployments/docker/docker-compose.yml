name: petverse

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: petverse
      POSTGRES_PASSWORD: petverse
      POSTGRES_DB: petverse
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petverse -d petverse"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: petverse
      MINIO_ROOT_PASSWORD: petverse-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
